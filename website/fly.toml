# fly launch --no-deploy will rewrite app/primary_region — keep the rest.
app = "athfuelpath-web"
primary_region = "sjc"          # San Jose: the company and most early users are there

[build]
  dockerfile = "Dockerfile"
  [build.args]
    # THIS MUST BE THE HOST THIS BUILD IS ACTUALLY SERVED FROM.
    #
    # It said https://athfuelpath.com while the app was deployed to
    # athfuelpath-web.fly.dev, and that one line broke three things at once:
    #
    #   1. og:image pointed at https://athfuelpath.com/og/home.jpg. That domain
    #      serves nothing yet, so every link preview failed to load the share
    #      card, fell back to scraping the page, and picked the app screenshot
    #      out of the hero — which is what a pasted link looked like.
    #   2. Every canonical URL pointed at a domain that does not resolve.
    #   3. IS_PRODUCTION_SITE compares SITE_URL against the production origin.
    #      With this set to the production domain it was TRUE on the staging
    #      host, so robots.txt said "allow: /" and invited crawlers onto a
    #      preview deploy — the exact thing the check in site-url.ts exists to
    #      prevent. Lying about the host defeated its own safeguard.
    #
    # Switched to the production domain on 2026-08-29, when athfuelpath.com was
    # registered and pointed at this app. Nothing else changes with it:
    # robots.txt, sitemap.xml, canonicals and every og:image follow this value.
    #
    # TIMING, because this is a BUILD arg and not a runtime setting. The value is
    # compiled into the image, so the running app cannot pick up a new one — only
    # a fresh `fly deploy` can. That creates a window with exactly one safe order:
    #
    #   set the DNS records, then deploy, then let the certificate finish.
    #
    # Deploy too early and athfuelpath-web.fly.dev spends the wait serving
    # allow-crawl robots.txt with canonicals pointing at a domain that does not
    # resolve yet. Deploy too late and the far worse thing happens: the moment
    # the certificate issues, athfuelpath.com is live and serving
    # `noindex, nofollow` and `Disallow: /`, because SITE_URL still says fly.dev
    # and IS_PRODUCTION_SITE is false. Certificate issuance is public — it lands
    # in the Certificate Transparency logs that crawlers watch — so a first crawl
    # can arrive within minutes of the domain working, and a noindex seen on the
    # first visit is slow to undo.
    #
    # To go back to serving from fly.dev, set this back and redeploy; the site
    # returns to noindex on its own.
    NEXT_PUBLIC_SITE_URL = "https://athfuelpath.com"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # The site is 21 static pages behind Fly's proxy. Scaling to zero between
  # visits costs a ~1s cold start on the first request and nothing the rest of
  # the time; min_machines_running = 1 removes the cold start if you'd rather
  # pay for it. Two machines means a deploy never drops a request.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
